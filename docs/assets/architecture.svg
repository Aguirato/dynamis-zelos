<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="500" viewBox="0 0 1320 500" role="img" aria-labelledby="title desc"><title id="title">DYNAMIS ZELOS signal architecture</title><desc id="desc">Three electrodes feed one analog MyoWare channel, sampled by an ESP32 and sent over Bluetooth to a browser. Filtering, RMS, reference normalization and local CSV recording follow.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#f9d342"/></marker></defs><rect width="1320" height="500" rx="12" fill="#101613"/><g font-family="Arial,sans-serif"><text x="42" y="49" fill="#f9d342" font-size="11" letter-spacing="3">DYNAMIS ZELOS / SYSTEM ARCHITECTURE</text><text x="42" y="96" fill="#edf2e9" font-size="30">From an electrical signal to a recorded session.</text><text x="42" y="124" fill="#95a497" font-size="14">One sensor measures one differential channel. The three electrodes are not three separate muscles.</text><g fill="#19221b" stroke="#40533d"><rect x="42" y="173" width="216" height="133" rx="8"/><rect x="294" y="173" width="216" height="133" rx="8"/><rect x="546" y="173" width="216" height="133" rx="8"/><rect x="798" y="173" width="216" height="133" rx="8"/><rect x="1050" y="173" width="228" height="133" rx="8"/></g><g fill="#f9d342" font-size="11" letter-spacing="2"><text x="60" y="200">01 / ACQUIRE</text><text x="312" y="200">02 / CONDITION</text><text x="564" y="200">03 / SAMPLE</text><text x="816" y="200">04 / TRANSMIT</text><text x="1068" y="200">05 / EXPLORE</text></g><g fill="#f0f2ec" font-size="21"><text x="60" y="237">3 electrodes</text><text x="312" y="237">MyoWare 2.0</text><text x="564" y="237">ESP32 ADC</text><text x="816" y="237">Bluetooth LE</text><text x="1068" y="237">Signal studio</text></g><g fill="#95a497" font-size="13"><text x="60" y="267">MID + END + REF</text><text x="60" y="286">1 differential sEMG channel</text><text x="312" y="267">Amplification + analog filters</text><text x="312" y="286">RAW analog output</text><text x="564" y="267">GPIO36 · 12-bit counts</text><text x="564" y="286">Nominal 1,000 samples/s</text><text x="816" y="267">5 samples / 20-byte packet</text><text x="816" y="286">Sequence + device time</text><text x="1068" y="267">HP / LP → 100 ms RMS</text><text x="1068" y="286">Reference ratio + local CSV</text></g><g stroke="#f9d342" stroke-width="1.5" marker-end="url(#arrow)"><path d="M263 240h23"/><path d="M515 240h23"/><path d="M767 240h23"/><path d="M1019 240h23"/></g><rect x="42" y="343" width="1236" height="111" rx="8" fill="#202418" stroke="#4c4b2f"/><text x="62" y="373" fill="#f9d342" font-size="12" letter-spacing="2">WHAT THE NUMBERS MEAN</text><text x="62" y="402" fill="#cbd3c4" font-size="14">Raw and filtered samples use ADC counts. Relative activity = 100 × RMS / reference RMS, and can exceed 100%.</text><text x="62" y="429" fill="#95a497" font-size="14">No direct force estimate, recruitment percentage, cross-device synchronization or clinical interpretation is provided.</text><text x="42" y="483" fill="#718573" font-size="10" letter-spacing="1.7">REFERENCE BUILD · BATTERY ONLY WHEN BODY-CONNECTED · RADIO AND ANALOG PERFORMANCE REQUIRE PHYSICAL TESTING</text></g></svg>
