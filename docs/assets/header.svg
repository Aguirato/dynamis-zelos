<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc"><title id="title">DYNAMIS ZELOS — Science in motion</title><desc id="desc">Wireless sEMG research prototype with live signals, Bluetooth firmware and reproducible tests. Non-commercial use only. Concept illustration, not a manufactured device.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111815"/><stop offset="1" stop-color="#050907"/></linearGradient><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#203126" stroke-width=".6"/></pattern></defs><rect width="1440" height="540" fill="url(#bg)"/><rect x="790" width="650" height="540" fill="url(#grid)"/><path d="M56 66h42c22 0 34 11 34 28 0 17-13 29-34 29H67l39-39H90l-40 39H36l46-48H64z" fill="#f9d342"/><text x="154" y="93" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="7">DYNAMIS</text><text x="156" y="120" fill="#f9d342" font-family="Arial, sans-serif" font-size="15" letter-spacing="9">ZELOS</text><text x="58" y="202" fill="#f9d342" font-family="Arial,sans-serif" font-size="12" letter-spacing="5">SCIENCE IN MOTION</text><text x="55" y="267" fill="#f2f4ef" font-family="Arial,sans-serif" font-size="54" letter-spacing="-2">See the signal.</text><text x="55" y="328" fill="#9cae9f" font-family="Arial,sans-serif" font-size="54" letter-spacing="-2">Understand the movement.</text><text x="58" y="378" fill="#9aa99d" font-family="Arial,sans-serif" font-size="17">A wireless sEMG research prototype. Built to explore, measure and learn.</text><g font-family="Arial,sans-serif" font-size="11" letter-spacing="2"><rect x="58" y="423" width="174" height="35" rx="4" fill="#292d1b" stroke="#696038"/><text x="74" y="445" fill="#f9d342">LIVE SIGNAL STUDIO</text><text x="257" y="445" fill="#a9b4aa">BLE FIRMWARE</text><text x="421" y="445" fill="#a9b4aa">REPRODUCIBLE TESTS</text></g><